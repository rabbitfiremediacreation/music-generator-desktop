name: Desktop bundles
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main', 'codex/desktop-bundles']
  release:
    types: [published]
permissions:
  contents: read
  actions: read
jobs:
  build:
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'release' && '[
            {"os":"macos-15","name":"macos-arm64","arch":"arm64","macos_min":"14.0"},
            {"os":"macos-15-intel","name":"macos-x64","arch":"x64","macos_min":"13.3"},
            {"os":"windows-2022","name":"windows-x64","arch":"x64"},
            {"os":"ubuntu-22.04","name":"linux-x64","arch":"x64","linux_backend":"vulkan"},
            {"os":"ubuntu-22.04","name":"linux-x64-cuda","arch":"x64","linux_backend":"cuda"}
          ]' || github.event_name == 'pull_request' && '[
            {"os":"macos-15","name":"macos-arm64","arch":"arm64","macos_min":"14.0"},
            {"os":"macos-15-intel","name":"macos-x64","arch":"x64","macos_min":"13.3"},
            {"os":"windows-2022","name":"windows-x64","arch":"x64"},
            {"os":"ubuntu-22.04","name":"linux-x64","arch":"x64","linux_backend":"vulkan"}
          ]' || '[{"os":"macos-15","name":"macos-arm64","arch":"arm64","macos_min":"14.0"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
      MUSIC_GENERATOR_LINUX_BACKEND: ${{ matrix.linux_backend || 'vulkan' }}
      APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl unzip patchelf libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libvulkan-dev libfuse2 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Pinned Vulkan SDK for Ubuntu 22.04
        if: runner.os == 'Linux' && matrix.linux_backend == 'vulkan'
        run: |
          curl --fail --location --retry 3 https://sdk.lunarg.com/sdk/download/1.4.309.0/linux/vulkansdk-linux-x86_64-1.4.309.0.tar.xz -o "$RUNNER_TEMP/vulkan.tar.xz"
          echo "616a25a9d8b33336e83957f97ca273b8e95461649723354300d02c26ae52a1f6  $RUNNER_TEMP/vulkan.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vulkan"
          tar -xf "$RUNNER_TEMP/vulkan.tar.xz" -C "$RUNNER_TEMP/vulkan" 1.4.309.0/x86_64
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan/1.4.309.0/x86_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan/1.4.309.0/x86_64/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Verify native build architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Wrong native runner architecture')"
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Compute native runtime cache key
        id: runtime-key
        run: node scripts/desktop/cache-runtime.mjs key
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: |
            src-tauri/resources/engine
            src-tauri/resources/WebView2
          key: ${{ steps.runtime-key.outputs.key }}
          restore-keys: desktop-runtime-${{ matrix.name }}-
      - name: Reuse verified runtime from an earlier release or branch
        id: shared-runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_CACHE_KEY: ${{ steps.runtime-key.outputs.key }}
          RUNTIME_CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: node scripts/desktop/cache-runtime.mjs restore
      - name: Space for the CUDA compiler and runtime libraries
        if: matrix.linux_backend == 'cuda'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/cache@v4
        if: matrix.linux_backend == 'cuda' && steps.runtime-cache.outputs.cache-hit != 'true' && steps.shared-runtime.outputs.restored != 'true'
        with:
          path: .cache/desktop/cuda
          key: cuda-linux-x64-${{ hashFiles('models/cuda-linux.json', 'scripts/desktop/prepare-cuda.mjs') }}
      - run: npm run bundle
      - name: Verify relocated portable bundle
        run: node scripts/desktop/verify-bundle.mjs
      - name: Record NVIDIA hardware acceptance requirement
        if: matrix.linux_backend == 'cuda'
        run: echo 'CPU startup and dependency checks passed on a runner without an NVIDIA GPU. Real CUDA generation still requires NVIDIA hardware acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: node scripts/desktop/verify-bundle.mjs --dmg
      - name: Archive verified native runtime for future releases
        id: shared-archive
        if: steps.shared-runtime.outputs.available != 'true'
        run: node scripts/desktop/cache-runtime.mjs pack
      - uses: actions/upload-artifact@v4
        if: steps.shared-runtime.outputs.available != 'true'
        with:
          name: ${{ steps.runtime-key.outputs.key }}
          path: ${{ steps.shared-archive.outputs.archive }}
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Generator-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
      - name: Publish verified platform assets
        if: github.event_name == 'release' && github.event.action == 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/desktop/publish-release.mjs --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --target "${{ matrix.name }}" --directory release
