name: Desktop bundles
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main', 'codex/desktop-bundles']
  schedule:
    - cron: '23 3 * * *'
  release:
    types: [published]
permissions:
  contents: read
  actions: read
env:
  UPDATE_STREAM: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && 'daily' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'develop' || '' }}
jobs:
  update-notes:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate update notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/desktop/release-notes.mjs generate update-notes
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-update-notes
          path: update-notes/
          overwrite: true
          if-no-files-found: error
  build:
    needs: update-notes
    if: ${{ !cancelled() && (needs.update-notes.result == 'success' || needs.update-notes.result == 'skipped') }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[
            {"os":"macos-15","name":"macos-arm64","arch":"arm64","macos_min":"14.0"},
            {"os":"macos-15-intel","name":"macos-x64","arch":"x64","macos_min":"13.3"},
            {"os":"windows-2022","name":"windows-x64","arch":"x64"},
            {"os":"ubuntu-22.04","name":"linux-x64","arch":"x64","linux_backend":"vulkan"},
            {"os":"ubuntu-22.04","name":"linux-x64-cuda","arch":"x64","linux_backend":"cuda"}
          ]' || github.event_name == 'pull_request' && '[
            {"os":"macos-15","name":"macos-arm64","arch":"arm64","macos_min":"14.0"},
            {"os":"macos-15-intel","name":"macos-x64","arch":"x64","macos_min":"13.3"},
            {"os":"windows-2022","name":"windows-x64","arch":"x64"},
            {"os":"ubuntu-22.04","name":"linux-x64","arch":"x64","linux_backend":"vulkan"}
          ]' || '[
            {"os":"macos-15","name":"macos-arm64","arch":"arm64","macos_min":"14.0"},
            {"os":"windows-2022","name":"windows-x64","arch":"x64"}
          ]') }}
    runs-on: ${{ matrix.os }}
    env:
      DESKTOP_RUNNER: ${{ matrix.os }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
      MUSIC_GENERATOR_LINUX_BACKEND: ${{ matrix.linux_backend || 'vulkan' }}
      MUSIC_GENERATOR_REQUIRE_NOTARIZATION: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl unzip patchelf libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libvulkan-dev libfuse2 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: npm ci
      - name: Verify native build architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Wrong native runner architecture')"
      - run: npm run build
      - run: npm run lint
      # Keep DOM-heavy suites from contending for the Intel runner's CPUs.
      - run: npm test ${{ matrix.name == 'macos-x64' && '-- --maxWorkers=2' || '' }}
      - run: npm run test:desktop
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Space for the CUDA compiler and runtime libraries
        if: matrix.linux_backend == 'cuda'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Compute native runtime cache key
        id: runtime-key
        run: node scripts/desktop/cache-runtime.mjs key
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: |
            src-tauri/resources/engine
            src-tauri/resources/WebView2
          key: ${{ steps.runtime-key.outputs.key }}
          restore-keys: ${{ steps.runtime-key.outputs.prefix }}
      - name: Reuse verified runtime from an earlier release or branch
        id: shared-runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_CACHE_KEY: ${{ steps.runtime-key.outputs.key }}
          RUNTIME_CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: node scripts/desktop/cache-runtime.mjs restore
      - name: Check whether the Linux engine needs compilation
        id: linux-engine
        if: runner.os == 'Linux' && steps.shared-runtime.outputs.restored != 'true'
        run: node scripts/desktop/cache-runtime.mjs check-ace
      - name: Pinned Vulkan SDK for Ubuntu 22.04
        if: matrix.linux_backend == 'vulkan' && steps.linux-engine.outputs.build == 'true'
        run: bash scripts/desktop/prepare-vulkan.sh
      - uses: actions/cache@v4
        if: matrix.linux_backend == 'cuda' && steps.linux-engine.outputs.build == 'true'
        with:
          path: .cache/desktop/cuda
          key: cuda-linux-x64-${{ hashFiles('models/cuda-linux.json', 'scripts/desktop/prepare-cuda.mjs') }}
      - name: Prepare and verify native components
        if: steps.runtime-cache.outputs.cache-hit != 'true' && steps.shared-runtime.outputs.restored != 'true'
        run: node scripts/desktop/cache-runtime.mjs prepare
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/resources/engine
            src-tauri/resources/WebView2
          key: ${{ steps.runtime-key.outputs.key }}
      - uses: actions/download-artifact@v4
        if: runner.os == 'macOS' && needs.update-notes.result == 'success'
        with:
          name: Desktop-update-notes
          path: update-notes
      - run: npm run bundle
        env:
          MUSIC_GENERATOR_UPDATE_NOTES: ${{ needs.update-notes.result == 'success' && 'update-notes/release-notes.html' || '' }}
          MUSIC_GENERATOR_UPDATE_BUILD: ${{ env.UPDATE_STREAM != '' && format('{0}-{1}', env.UPDATE_STREAM, github.run_number) || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (github.event_name == 'release' || env.UPDATE_STREAM != '') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && (github.event_name == 'release' || env.UPDATE_STREAM != '') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && (github.event_name == 'release' || env.UPDATE_STREAM != '') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && (github.event_name == 'release' || env.UPDATE_STREAM != '') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && (github.event_name == 'release' || env.UPDATE_STREAM != '') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && (github.event_name == 'release' || env.UPDATE_STREAM != '') && secrets.APPLE_TEAM_ID || '' }}
          SPARKLE_PUBLIC_KEY: ${{ runner.os == 'macOS' && (env.MUSIC_GENERATOR_REQUIRE_NOTARIZATION == 'true' || env.UPDATE_STREAM != '') && vars.SPARKLE_PUBLIC_KEY || '' }}
          SPARKLE_PRIVATE_KEY: ${{ runner.os == 'macOS' && (env.MUSIC_GENERATOR_REQUIRE_NOTARIZATION == 'true' || env.UPDATE_STREAM != '') && secrets.SPARKLE_PRIVATE_KEY || '' }}
      - name: Verify relocated portable bundle
        env:
          MUSIC_GENERATOR_UPDATE_BUILD: ${{ env.UPDATE_STREAM != '' && format('{0}-{1}', env.UPDATE_STREAM, github.run_number) || '' }}
        run: node scripts/desktop/verify-bundle.mjs
      - name: Verify Windows MSI installation and removal
        if: runner.os == 'Windows'
        timeout-minutes: 25
        run: node scripts/desktop/verify-bundle.mjs --msi
      - name: Upload Windows Installer diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-MSI-diagnostics
          path: test-results/windows-msi/
          if-no-files-found: ignore
      - name: Record NVIDIA hardware acceptance requirement
        if: matrix.linux_backend == 'cuda'
        run: echo 'CPU startup and dependency checks passed on a runner without an NVIDIA GPU. Real CUDA generation still requires NVIDIA hardware acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        env:
          MUSIC_GENERATOR_UPDATE_BUILD: ${{ env.UPDATE_STREAM != '' && format('{0}-{1}', env.UPDATE_STREAM, github.run_number) || '' }}
        run: node scripts/desktop/verify-bundle.mjs --dmg
      - name: Archive verified native runtime for future releases
        id: shared-archive
        if: steps.shared-runtime.outputs.available != 'true'
        run: node scripts/desktop/cache-runtime.mjs pack
      - uses: actions/upload-artifact@v4
        if: steps.shared-runtime.outputs.available != 'true'
        with:
          name: ${{ steps.runtime-key.outputs.key }}
          path: ${{ steps.shared-archive.outputs.archive }}
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Generator-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
      - name: Publish verified platform assets
        if: github.event_name == 'release' && github.event.action == 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/desktop/publish-release.mjs --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --target "${{ matrix.name }}" --directory release
  publish-stable-notes:
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: Desktop-update-notes
          path: update-notes
      - name: Add update notes to the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/desktop/release-notes.mjs publish update-notes/release-notes.md
  publish-stream:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'desktop-publish-daily' || 'desktop-publish-develop' }}
      queue: max
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: Music-Generator-*
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: Desktop-update-notes
          path: update-notes
      - name: Publish verified stream packages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop/publish-stream.mjs
      - name: Retain two releases for the update stream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_STREAM_TAG: ${{ steps.publish.outputs.active_tag }}
        run: |
          published_tags=$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.prerelease and (.draft | not)) | .tag_name | select(test(\"^${UPDATE_STREAM}-[1-9][0-9]*$\"))" \
              | sort -t- -k2,2nr
          )
          if [[ -n "$ACTIVE_STREAM_TAG" ]]; then
            if ! grep -Fxq -- "$ACTIVE_STREAM_TAG" <<< "$published_tags"; then
              echo "The active Sparkle release is missing from the published $UPDATE_STREAM releases." >&2
              exit 1
            fi
            stale_tags=$(awk -v active="$ACTIVE_STREAM_TAG" '$0 != active && ++other > 1' <<< "$published_tags")
          else
            stale_tags=$(tail -n +3 <<< "$published_tags")
          fi
          while IFS= read -r tag && [[ -n "$tag" ]]; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done <<< "$stale_tags"
